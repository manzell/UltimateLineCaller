<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">/*FAVICON*/<title>Game RSVP</title>
<style>
:root { --bg: #eef1f7; --panel: #ffffff; --ink: #11183a; --muted: #4c5577; --line: #d3d9e8; --accent: #2632c9; --yes: #0b6b45; --no: #a81f2d; --maybe: #7d5300; color-scheme: light; }
@media (prefers-color-scheme: dark) { :root { --bg: #0d1126; --panel: #171c39; --ink: #eef1ff; --muted: #a8b0d2; --line: #343c66; --accent: #9aa3ff; --yes: #7fe0b1; --no: #ff9aa3; --maybe: #f5c869; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.45 system-ui, -apple-system, Roboto, sans-serif; }
main { max-width: 640px; margin: 0 auto; padding: 20px 16px 40px; }
h1 { font-size: 1.6rem; margin: 0 0 4px; } p { margin: 4px 0; } .muted { color: var(--muted); }
label { display: block; font-weight: 700; margin: 18px 0 6px; }
select, input { width: 100%; font: inherit; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); }
.game { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-top: 12px; }
.game h2 { font-size: 1.1rem; margin: 0; } .btns { display: flex; gap: 8px; margin-top: 10px; }
.btns button { flex: 1; min-height: 44px; font: 700 1rem system-ui, sans-serif; border-radius: 8px; border: 2px solid var(--line); background: transparent; color: var(--ink); cursor: pointer; }
.btns button[aria-pressed="true"].yes { border-color: var(--yes); color: var(--yes); } .btns button[aria-pressed="true"].no { border-color: var(--no); color: var(--no); } .btns button[aria-pressed="true"].maybe { border-color: var(--maybe); color: var(--maybe); }
.note { margin-top: 8px; } .status { min-height: 1.4em; font-size: .9rem; color: var(--muted); margin-top: 6px; }
</style></head><body><main id="app"><p class="muted">Loading…</p></main>
<script>/*CONFIG*/</script>
<script>
(function () {
  const cfg = window.FIREBASE_CONFIG, key = location.hash.slice(1).replace(/[^A-Za-z0-9]/g, '');
  const base = `https://firestore.googleapis.com/v1/projects/${cfg.projectId}/databases/(default)/documents/rsvp/${key}`;
  const app = document.getElementById('app');
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const store = { get: (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) { /* fine */ } } };
  let data = null, answers = {}, who = store.get('rsvp-player-' + key) || '';
  const when = (g) => new Date(g.date + 'T12:00:00').toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });
  function render() {
    const today = new Date().toISOString().slice(0, 10);
    const games = data.games.filter((g) => g.date >= today).sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));
    const players = data.players.slice().sort((a, b) => a.name.localeCompare(b.name));
    app.innerHTML = `<h1>${esc(data.team)}</h1><p class="muted">Let the coaches know who's coming.</p>
      <label for="who">Player</label><select id="who"><option value="">Choose a player</option>${players.map((p) => `<option value="${esc(p.id)}" ${p.id === who ? 'selected' : ''}>${esc(p.name)}${p.no ? ' #' + esc(p.no) : ''}</option>`).join('')}</select>
      ${!who ? '' : games.length ? games.map((g) => { const a = answers[g.id + '_' + who] || {}; return `<div class="game"><h2>${g.kind === 'practice' ? 'Practice' : `vs ${esc(g.opponent || 'Opponent')}`}</h2><p>${esc(when(g))}${g.time ? ' · ' + esc(g.time) : ''}</p>${g.location ? `<p class="muted">${esc(g.location)}</p>` : ''}
        <div class="btns">${[['yes', 'Going'], ['maybe', 'Maybe'], ['no', "Can't go"]].map(([s, l]) => `<button type="button" class="${s}" data-g="${esc(g.id)}" data-s="${s}" aria-pressed="${a.status === s}">${l}</button>`).join('')}</div>
        <input class="note" type="text" maxlength="190" placeholder="Note for the coach (optional)" data-note="${esc(g.id)}" value="${esc(a.note || '')}"><div class="status" id="st-${esc(g.id)}" role="status"></div></div>`; }).join('') : '<p class="muted" style="margin-top:16px">Nothing is scheduled yet.</p>'}`;
    document.getElementById('who').onchange = (e) => { who = e.target.value; store.set('rsvp-player-' + key, who); render(); };
    app.querySelectorAll('[data-s]').forEach((b) => { b.onclick = () => send(b.dataset.g, b.dataset.s); });
    app.querySelectorAll('[data-note]').forEach((i) => { i.onchange = () => { const a = answers[i.dataset.note + '_' + who]; if (a && a.status) send(i.dataset.note, a.status); }; });
  }
  async function send(game, status) {
    const id = game + '_' + who, noteEl = app.querySelector(`[data-note="${CSS.escape(game)}"]`), note = noteEl ? noteEl.value.slice(0, 190) : '';
    const st = document.getElementById('st-' + game); if (st) st.textContent = 'Saving…';
    const body = { fields: { game: { stringValue: game }, player: { stringValue: who }, status: { stringValue: status }, note: { stringValue: note }, at: { integerValue: String(Date.now()) } } };
    try {
      const r = await fetch(`${base}/answers/${encodeURIComponent(id)}?key=${cfg.apiKey}`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
      if (!r.ok) throw new Error(r.status);
      answers[id] = { status, note }; render();
      const s2 = document.getElementById('st-' + game); if (s2) s2.textContent = 'Saved. Thanks!';
    } catch (e) { if (st) st.textContent = "That didn't save. Check your connection and try again."; }
  }
  async function load() {
    if (!key) { app.innerHTML = '<p>This RSVP link is incomplete. Ask your coach for the link again.</p>'; return; }
    try {
      const r = await fetch(`${base}?key=${cfg.apiKey}`);
      if (!r.ok) throw new Error(r.status);
      const doc = await r.json();
      data = JSON.parse(doc.fields.json.stringValue);
      const list = await fetch(`${base}/answers?pageSize=300&key=${cfg.apiKey}`).then((x) => (x.ok ? x.json() : {})).catch(() => ({}));
      (list.documents || []).forEach((d) => { const f = d.fields || {}; answers[d.name.split('/').pop()] = { status: f.status && f.status.stringValue, note: f.note ? f.note.stringValue : '' }; });
      if (who && !data.players.some((p) => p.id === who)) who = '';
      render();
    } catch (e) { app.innerHTML = "<p>This RSVP link isn't working. It may have been replaced; ask your coach for the current link.</p>"; }
  }
  load();
})();
</script></body></html>
