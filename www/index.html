<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Line Caller</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>/* Layout: a sideline clipboard. The line you are about to call is big and left; the bench is a ranked list on the right. Built for glare and thumbs. */
:root {
  --bg: #e9edf5; --panel: #fbfcff; --panel-2: #dfe5f1; --ink: #11183a; --muted: #4c5577; --line: #c4cce0;
  --accent: #2632c9; --on-accent: #ffffff; --cone: #e64f00; --on-cone: #ffffff;
  --good: #0b6b45; --good-bg: #d3eee0; --warn: #7d5300; --warn-bg: #fbe8bd; --bad: #a81f2d; --bad-bg: #fbd9dc;
  --meter: #2632c9; --tick: #11183a;
  --slash: #c8202f; --slash-hot: #ff0a1e; --us-tint: rgba(38, 50, 201, .11);
  --ev-goal: #0b7a3e; --ev-assist: #1565c0; --ev-turn: #c62828; --ev-block: #7b3fb3; --ev-opp: #8a6400; --on-ev: #ffffff; --cross: #6a2bbf; --break: #d31027; --wmp: #b0176b; --mmp: #0a6f7d; --on-tile: #ffffff; --tile: #11183a;
  --display: 'Barlow Condensed', 'Arial Narrow', 'Roboto Condensed', sans-serif;
  --body: 'Atkinson Hyperlegible', Roboto, system-ui, sans-serif;
  --t-s: .8125rem; --t-m: 1rem; --t-l: 1.3125rem; --t-xl: 1.75rem; --t-xxl: 3.25rem;
  --tap: 52px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0d1126; --panel: #171c39; --panel-2: #232a4e; --ink: #eef1ff; --muted: #a8b0d2; --line: #343c66;
  --accent: #9aa3ff; --on-accent: #0d1126; --cone: #ff8a3d; --on-cone: #1a0b00;
  --good: #7fe0b1; --good-bg: #123a2c; --warn: #f5c869; --warn-bg: #413111; --bad: #ff9aa3; --bad-bg: #4b1a22;
  --meter: #9aa3ff; --tick: #eef1ff; --slash: #e5636e; --slash-hot: #ff3b49; --us-tint: rgba(154, 163, 255, .17); --ev-goal: #6fe0a5; --ev-assist: #8cc4ff; --ev-turn: #ff9a9a; --ev-block: #d3a6ff; --ev-opp: #f0c95a; --on-ev: #0d1126; --cross: #b58cff; --break: #ff5a68; --wmp: #f39ad0; --mmp: #63d3e0; --on-tile: #0d1126; --tile: #eef1ff; color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #0d1126; --panel: #171c39; --panel-2: #232a4e; --ink: #eef1ff; --muted: #a8b0d2; --line: #343c66;
  --accent: #9aa3ff; --on-accent: #0d1126; --cone: #ff8a3d; --on-cone: #1a0b00;
  --good: #7fe0b1; --good-bg: #123a2c; --warn: #f5c869; --warn-bg: #413111; --bad: #ff9aa3; --bad-bg: #4b1a22;
  --meter: #9aa3ff; --tick: #eef1ff; --slash: #e5636e; --slash-hot: #ff3b49; --us-tint: rgba(154, 163, 255, .17); --ev-goal: #6fe0a5; --ev-assist: #8cc4ff; --ev-turn: #ff9a9a; --ev-block: #d3a6ff; --ev-opp: #f0c95a; --on-ev: #0d1126; --cross: #b58cff; --break: #ff5a68; --wmp: #f39ad0; --mmp: #63d3e0; --on-tile: #0d1126; --tile: #eef1ff; color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; background: var(--bg); color: var(--ink); font: 400 var(--t-m)/1.35 var(--body); font-variant-numeric: tabular-nums; touch-action: manipulation; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; text-align: left; }
:focus-visible { outline: 3px solid var(--cone); outline-offset: 2px; }
h1, h2, h3 { margin: 0; font-family: var(--display); font-weight: 700; text-wrap: balance; }
h2 { font-size: var(--t-xl); line-height: 1.1; }
h3 { font-size: var(--t-l); line-height: 1.1; }
p { margin: 0; }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 24px; max-width: 1400px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
.muted { color: var(--muted); }
.small { font-size: var(--t-s); }
.label { font-size: var(--t-s); font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }

/* App bar */
.bar { display: flex; align-items: center; gap: 16px; padding-block: 8px; flex-wrap: wrap; }
.brand { font: 700 var(--t-xl)/1 var(--display); letter-spacing: .01em; }
.tabs { display: flex; gap: 4px; margin-left: auto; }
.tab { min-height: 44px; padding: 0 16px; font: 600 var(--t-l)/1 var(--display); color: var(--muted); border-radius: 6px; }
.tab[aria-current="page"] { background: var(--ink); color: var(--bg); }

.banner { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; background: var(--warn-bg); color: var(--warn); padding: 8px 12px; border-radius: 6px; }

/* Buttons */
.btn { min-height: var(--tap); padding: 0 18px; border-radius: 8px; font: 600 var(--t-l)/1 var(--display); background: var(--panel-2); text-align: center; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn.small-btn { min-height: 44px; font-size: var(--t-m); padding: 0 14px; }
.btn.primary { background: var(--accent); color: var(--on-accent); }
.btn.go { background: var(--cone); color: var(--on-cone); font-size: var(--t-xl); min-height: 68px; width: 100%; }
.btn.danger { color: var(--bad); }
.btn[disabled] { opacity: .45; cursor: default; }
.seg { display: inline-flex; flex-wrap: wrap; background: var(--panel-2); border-radius: 8px; padding: 3px; gap: 2px; }
.seg button { min-height: 44px; padding: 0 14px; border-radius: 6px; font: 600 var(--t-m)/1 var(--display); font-size: 1.125rem; color: var(--muted); text-align: center; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }

/* Scoreboard */
.score { display: flex; align-items: center; gap: 12px 24px; flex-wrap: wrap; background: var(--panel); border-radius: 10px; padding: 8px 16px; }
.nums { display: flex; align-items: center; gap: 14px; font-family: var(--display); }
.nums b { font-size: var(--t-xxl); line-height: 1; font-weight: 700; }
.nums .team { display: block; font-size: var(--t-s); font-family: var(--body); color: var(--muted); max-width: 11ch; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nums .side { text-align: center; }
.nums .dash { font-size: var(--t-xl); color: var(--muted); }
.chips { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.chip { min-height: 44px; display: inline-flex; align-items: center; gap: 6px; padding: 0 12px; border-radius: 6px; background: var(--panel-2); font: 600 1.125rem/1 var(--display); }
.chip.onO { background: var(--accent); color: var(--on-accent); }
.chip.onD { background: var(--ink); color: var(--bg); }
.right { margin-left: auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

/* Game grid */
.game { display: grid; grid-template-columns: minmax(0, 1.75fr) minmax(300px, 1fr); gap: 12px; align-items: start; }
@media (max-width: 800px) { .game { grid-template-columns: minmax(0, 1fr); } }
.panel { background: var(--panel); border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.panel-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.role-group { display: flex; flex-direction: column; gap: 5px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 6px; }
@media (max-width: 480px) { .cards { grid-template-columns: minmax(0, 1fr); } }
.pc { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; grid-template-rows: auto auto; column-gap: 10px; align-items: center; min-height: 64px; padding: 7px 10px 7px 7px; border-radius: 8px; background: var(--panel-2); width: 100%; border: 2px solid transparent; }
.pc.sel { border-color: var(--cone); }
.nm { font: 600 var(--t-l)/1.1 var(--display); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; gap: 5px; align-items: center; }
.meta { grid-column: 2 / 4; font-size: var(--t-s); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fr { font: 700 var(--t-s)/1 var(--body); padding: 3px 6px; border-radius: 4px; }
.fr.Fresh { color: var(--good); background: var(--good-bg); }
.fr.OK { color: var(--warn); background: var(--warn-bg); }
.fr.Tired { color: var(--bad); background: var(--bad-bg); }
.lock { font: 700 var(--t-s)/1 var(--body); color: var(--cone); }

.strength { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.st .row { display: flex; justify-content: space-between; align-items: baseline; font-size: var(--t-s); color: var(--muted); }
.st .row b { font: 700 var(--t-l)/1 var(--display); color: var(--ink); }
.meter { position: relative; height: 8px; background: var(--panel-2); border-radius: 4px; margin-top: 3px; }
.meter i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--meter); border-radius: 4px; }
.meter u { position: absolute; top: -3px; bottom: -3px; width: 2px; margin-left: -1px; background: var(--tick); box-shadow: 0 0 0 1px var(--panel); }

.warns { display: flex; flex-direction: column; gap: 4px; background: var(--warn-bg); color: var(--warn); border-radius: 6px; padding: 8px 10px; font-size: var(--t-s); }
.warns b { font-weight: 700; }
.sticky-go { position: sticky; bottom: env(safe-area-inset-bottom, 0px); padding-block: 6px 2px; background: var(--panel); display: flex; flex-direction: column; gap: 6px; z-index: 3; }
.selbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; background: var(--panel-2); border-radius: 8px; padding: 6px 10px; }
.selbar p { flex: 1 1 200px; min-width: 0; }

/* Bench */
.list { display: flex; flex-direction: column; gap: 4px; }
.br { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: stretch; border-radius: 8px; background: var(--panel-2); border: 2px solid transparent; width: 100%; }
.br.sel { border-color: var(--cone); }
.br.owed .owe { color: var(--cone); font-weight: 700; }

/* Live */
.timer { font: 700 clamp(3.25rem, 7vw, 4.75rem)/1 var(--display); text-align: center; min-width: 3.2ch; }
.score-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; flex: 1 1 280px; min-width: 0; }
.score-btns .btn { min-height: 84px; font-size: var(--t-xl); padding: 0 8px; }
.compact { display: flex; flex-direction: column; gap: 3px; }
.compact div { display: flex; align-items: center; gap: 8px; font-size: 1.0625rem; min-width: 0; }
.compact .cn { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.compact .tag { font-size: var(--t-s); color: var(--muted); }
.next-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

/* Forms and setup */
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
input[type=text], input[type=number], select, textarea { min-height: var(--tap); padding: 0 12px; background: var(--panel-2); border: 2px solid transparent; border-radius: 8px; width: 100%; }
textarea { padding: 10px 12px; min-height: 110px; font-family: ui-monospace, monospace; font-size: var(--t-s); }
.form-row { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; }
.form-row .grow { flex: 1 1 220px; }
.attend { display: flex; flex-wrap: wrap; gap: 6px; }
.tog { min-height: 48px; padding: 0 14px; border-radius: 8px; background: var(--panel-2); font: 600 1.125rem/1 var(--display); color: var(--muted); display: inline-flex; align-items: center; text-align: center; }
.tog[aria-pressed="true"] { background: var(--ink); color: var(--bg); }

/* Roster table */
.tbl-scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; }
th { text-align: center; font-size: var(--t-s); color: var(--muted); padding: 4px 2px; }
th:first-child { text-align: left; }
td { padding: 2px; border-top: 1px solid var(--line); }
.who { min-height: 52px; width: 100%; display: block; padding: 4px 6px; }
.who strong { font: 600 var(--t-l)/1.1 var(--display); display: block; }
.who span { font-size: var(--t-s); color: var(--muted); }
.rate { width: 100%; min-width: 44px; height: 48px; border-radius: 6px; text-align: center; font: 700 var(--t-l)/1 var(--display); background: color-mix(in srgb, var(--accent) calc(var(--lv) * 7%), var(--panel-2)); color: var(--ink); }
.rate.high { background: var(--accent); color: var(--on-accent); }
.pips { display: grid; grid-template-columns: repeat(5, minmax(44px, 1fr)); gap: 4px; }
.pips button { height: 48px; text-align: center; border-radius: 6px; background: var(--panel-2); font: 700 var(--t-l)/1 var(--display); }
.pips button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }

/* Sheet */
.scrim { position: fixed; inset: 0; background: rgba(8, 11, 30, .55); z-index: 20; display: flex; justify-content: center; align-items: flex-start; overflow-y: auto; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.sheet { background: var(--panel); border-radius: 12px; padding: 16px; width: min(560px, 100%); display: flex; flex-direction: column; gap: 14px; }

/* Playtime */
.pt { display: grid; grid-template-columns: minmax(90px, 1.1fr) minmax(90px, 2fr) 72px 56px 64px auto; gap: 10px; align-items: center; min-height: 48px; border-top: 1px solid var(--line); padding-block: 3px; }
.pt.head { min-height: 0; border: 0; font-size: var(--t-s); color: var(--muted); }
.pt .nm { font-size: 1.1875rem; }
.pt .meter { height: 12px; margin: 0; }
.pt .r { text-align: right; }
@media (max-width: 620px) { .pt { grid-template-columns: minmax(80px, 1fr) minmax(70px, 1.4fr) 62px auto; } .pt .opt { display: none; } }

/* Rules */
.rules { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(330px, 100%), 1fr)); gap: 12px; align-items: start; }
.rl { display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 52px; border-top: 1px solid var(--line); }
.rl:first-of-type { border-top: 0; }
.rl > span:first-child { min-width: 0; }
.step { display: inline-flex; align-items: center; gap: 2px; flex: none; }
.step button { width: 44px; height: 44px; border-radius: 6px; background: var(--panel-2); text-align: center; font: 700 var(--t-l)/1 var(--display); }
.step b { width: 36px; text-align: center; font: 700 var(--t-l)/1 var(--display); }
.tr { display: flex; flex-direction: column; gap: 4px; padding-block: 8px; border-top: 1px solid var(--line); }
.tr-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.tr-steps { display: flex; gap: 8px 20px; flex-wrap: wrap; }
.tr-step { display: inline-flex; align-items: center; gap: 8px; }
.taglist { display: flex; flex-wrap: wrap; gap: 6px; }
@media (prefers-reduced-motion: no-preference) { .pc, .br, .btn { transition: background-color .12s, border-color .12s; } }

/* Second pass: blank line, tiles, tooltips, drag, stats, voice, positions */
input, textarea, select { -webkit-user-select: text; user-select: text; }
.col { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.col .sticky-go { background: var(--bg); padding-block: 6px 4px; }
.tile { grid-row: 1 / 3; width: 44px; height: 44px; flex: none; border-radius: 7px; display: inline-flex; align-items: center; justify-content: center; font: 700 var(--t-l)/1 var(--display); background: var(--tile); color: var(--bg); font-variant-numeric: tabular-nums; }
.tile.W { background: var(--wmp); color: var(--on-tile); border-radius: 50%; }
.tile.M { background: var(--mmp); color: var(--on-tile); }
.tile.sm { width: 28px; height: 28px; font-size: .9375rem; border-radius: 5px; }
.tile.W.sm { border-radius: 50%; }
.pc { grid-template-columns: 44px minmax(0, 1fr) auto; touch-action: pan-y; }
.pc.dragged, .br-main.dragged { opacity: .35; }
.nm .tx { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.mb { font: 700 .6875rem/1 var(--body); padding: 2px 4px; border-radius: 3px; flex: none; color: var(--on-tile); }
.mb.W { background: var(--wmp); } .mb.M { background: var(--mmp); }
.legend { display: inline-flex; align-items: center; gap: 5px; color: var(--muted); }
.legend .tile.sm { width: 16px; height: 16px; }
[data-tip] { cursor: help; }
.fr, .mb { min-height: 20px; display: inline-flex; align-items: center; }
#tip { position: fixed; z-index: 40; max-width: min(300px, calc(100vw - 16px)); padding: 7px 10px; border-radius: 6px; background: var(--ink); color: var(--bg); font-size: var(--t-s); line-height: 1.3; pointer-events: none; box-shadow: 0 3px 12px rgba(8, 11, 30, .35); }
.ghost { position: fixed; z-index: 45; transform: translate(-50%, -130%); padding: 10px 14px; border-radius: 8px; background: var(--cone); color: var(--on-cone); font: 700 var(--t-l)/1 var(--display); pointer-events: none; white-space: nowrap; box-shadow: 0 6px 18px rgba(8, 11, 30, .4); }
.role-group, [data-drop="bench"] { border-radius: 8px; outline: 2px dashed transparent; outline-offset: 3px; }
.drop-on { outline-color: var(--cone); }
.slot { min-height: 52px; border: 2px dashed var(--line); border-radius: 8px; text-align: center; color: var(--muted); font: 600 1.125rem/1 var(--display); }
.slot.optional { border-style: dotted; }
.suggest { background: var(--panel); gap: 8px; }
.sug-row { display: flex; gap: 10px; align-items: center; }
.sug-row .label { width: 2.2em; flex: none; }
.sug-chips { display: flex; flex-wrap: wrap; gap: 4px; min-width: 0; }
.sug { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 4px 10px 4px 6px; border-radius: 6px; background: var(--panel-2); font-size: var(--t-m); }
.sug.placed { outline: 2px solid var(--accent); outline-offset: -2px; }
.br-main { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; grid-template-rows: auto auto; gap: 1px 10px; align-items: center; min-height: 60px; padding: 6px 8px 6px 7px; width: 100%; min-width: 0; touch-action: pan-y; border-radius: 8px; }
.br-main.gone { background: var(--panel-2); opacity: .7; }
.br-main .tile { grid-row: 1 / 3; }
.br-main .meta { grid-column: 2 / 4; }
.sit { width: 48px; font: 600 var(--t-m)/1 var(--display); text-align: center; color: var(--muted); border-left: 1px solid var(--line); }
.live-top { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.pc.onfield { min-height: 72px; }
.pc.onfield .meta b { color: var(--ink); }
.chain-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; background: var(--panel-2); border-radius: 8px; padding: 6px 8px 6px 12px; }
.chain { flex: 1 1 220px; min-width: 0; display: flex; flex-wrap: wrap; gap: 3px 6px; align-items: center; }
.ev { font: 600 1.125rem/1.2 var(--display); }
.ev.stat { color: var(--on-accent); background: var(--accent); padding: 2px 7px; border-radius: 4px; }
.voice { display: flex; flex-direction: column; gap: 8px; border: 2px solid var(--accent); border-radius: 8px; padding: 10px; }
.voice textarea { font: 400 var(--t-m)/1.35 var(--body); min-height: 76px; }
#voice-preview { display: flex; flex-direction: column; gap: 8px; }
.btn.rec-on { background: var(--bad); color: var(--bg); }
.menu-scrim { position: fixed; inset: 0; z-index: 30; }
.menu { position: fixed; display: flex; flex-direction: column; min-width: 180px; padding: 6px; gap: 2px; background: var(--panel); border-radius: 10px; box-shadow: 0 8px 28px rgba(8, 11, 30, .45); border: 1px solid var(--line); }
.menu .label { padding: 6px 10px; }
.menu button { min-height: 52px; padding: 0 12px; border-radius: 6px; font: 600 var(--t-l)/1 var(--display); }
.menu button:hover, .menu button:focus-visible { background: var(--panel-2); }
.who-row { display: flex; align-items: center; gap: 8px; }
.jersey { width: 88px; flex: none; }
.span-all { grid-column: 1 / -1; }
.pos-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(340px, 100%), 1fr)); gap: 10px; }
.pos { display: flex; flex-direction: column; gap: 8px; background: var(--bg); border-radius: 8px; padding: 10px; min-width: 0; }
.pos input, .pos select { background: var(--panel); }
.pos-limit { display: flex; align-items: center; gap: 6px 14px; flex-wrap: wrap; }
.pos-limit > .small:first-child { flex: 1 0 100%; }
.pos .rl { border-top: 0; min-height: 44px; }
.totals { display: flex; flex-direction: column; gap: 2px; }
.good-text { color: var(--good); } .bad-text { color: var(--bad); font-weight: 700; }
.under { color: var(--bad); font-weight: 700; }
table.stats th { padding-inline: 8px; }
.stat-name { font: 600 1.1875rem/1.1 var(--display); white-space: nowrap; padding-block: 6px; display: flex; align-items: center; gap: 8px; }
td.num { text-align: center; font-variant-numeric: tabular-nums; }
#voice-preview .chain { flex: none; }
.chain-row .btn { background: var(--panel); }

/* Third pass: name on its own line, Teams, previous points */
.pc, .br-main { grid-template-columns: 44px minmax(0, 1fr); grid-template-rows: auto auto; gap: 2px 10px; }
.nm { grid-column: 2; display: block; white-space: normal; overflow: visible; overflow-wrap: anywhere; }
.nm .tx { overflow: visible; }
.sub { grid-column: 2; display: flex; flex-wrap: wrap; align-items: center; gap: 3px 6px; min-width: 0; font-size: var(--t-s); color: var(--muted); }
.sub .meta, .br-main .meta { grid-column: auto; white-space: normal; overflow: visible; }
.pt .nm { grid-column: auto; }
.sit { width: 58px; font-size: .9375rem; line-height: 1.05; padding-inline: 4px; }
.mode { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; }
.team-now { font: 600 var(--t-l)/1 var(--display); color: var(--muted); min-height: 44px; }
.tog.here { min-height: 44px; padding: 0 10px; white-space: nowrap; font-size: var(--t-m); }
.pp { display: flex; flex-direction: column; gap: 6px; border-top: 1px solid var(--line); padding-block: 10px; }
.pp-head { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 12px; }
.pp-head strong { font: 700 var(--t-l)/1 var(--display); }
.pp-head .chip { min-height: 30px; }
.pp-score { font: 700 var(--t-l)/1 var(--display); }
.sug.static { min-height: 36px; }
.pos .rl { min-height: 48px; }
@media (max-width: 480px) { .mode { align-items: flex-start; } }
.pp .chain { flex: none; }
.who-row { color: var(--ink); }
.who .tile { color: var(--bg); font-size: .9375rem; }
.who .tile.W, .who .tile.M { color: var(--on-tile); }

/* Older Fire tablet browsers */
.rate { background-color: var(--panel-2); }
@supports (background: color-mix(in srgb, red 50%, blue)) { .rate { background: color-mix(in srgb, var(--accent) calc(var(--lv) * 7%), var(--panel-2)); } .rate.high { background: var(--accent); } }
.scrim, .menu-scrim { top: 0; right: 0; bottom: 0; left: 0; }

/* Scoresheet: drawn sideways when the device is held upright */
.ss { border-collapse: collapse; table-layout: fixed; font-variant-numeric: tabular-nums; }
.ss th, .ss td { border: 1px solid var(--line); text-align: center; font-size: var(--t-s); padding: 0; }
.ss thead th, .ss tfoot td, .ss tfoot th { height: 26px; min-width: 34px; width: 34px; }
.ss tbody td { height: 32px; width: 34px; min-width: 34px; }
.ss td svg { display: block; width: 100%; height: 32px; }
.ss .us { background-image: linear-gradient(var(--us-tint), var(--us-tint)); }
.ss .ss-name { position: sticky; left: 0; z-index: 1; background: var(--panel); text-align: left; padding: 0 8px; width: 170px; min-width: 170px; font-weight: 600; }
.ss-who { display: flex; align-items: center; gap: 6px; font: 600 1.0625rem/1 var(--display); white-space: nowrap; }
.ss-group th, .ss-group td { background: var(--panel-2); height: 24px; font-size: var(--t-s); font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
.ss-group .ss-name { background: var(--panel-2); }
.sl { stroke: var(--slash); stroke-width: 2.4; vector-effect: non-scaling-stroke; stroke-linecap: round; fill: none; }
.sl.long { stroke: var(--slash-hot); stroke-width: 5; }
.sl.short { stroke-width: 1; }
.ss-key { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.ss-key svg { width: 18px; height: 18px; border: 1px solid var(--line); }
.ss-tint { display: inline-block; width: 18px; height: 18px; border: 1px solid var(--line); background: var(--us-tint); }
@media (orientation: portrait) {
  .landscape { position: fixed; top: 0; left: 0; width: 100vh; height: 100vw; transform: translateX(100vw) rotate(90deg); transform-origin: top left; z-index: 25; overflow: auto; border-radius: 0; padding: 12px; background: var(--panel); }
}
/* Combos and the pass matrix */
.cb-names { white-space: normal; min-width: 160px; }
.hm { border-collapse: separate; border-spacing: 2px; font-variant-numeric: tabular-nums; }
.hm th { font-size: var(--t-s); color: var(--muted); min-width: 38px; font-weight: 700; }
.hm .hm-name { text-align: left; white-space: nowrap; padding-right: 8px; color: var(--ink); font: 600 1.0625rem/1 var(--display); position: sticky; left: 0; background: var(--panel); z-index: 1; }
.hm td { position: relative; width: 38px; height: 34px; text-align: center; background: var(--panel-2); border-radius: 3px; }
.hm td i { position: absolute; inset: 0; top: 0; left: 0; right: 0; bottom: 0; background: var(--accent); border-radius: 3px; }
.hm td b { position: relative; color: var(--ink); }
.hm td b.hot { color: var(--on-accent); }
.hm td.hm-self { background: transparent; }
.hm td.hm-total { background: transparent; font-weight: 700; }
/* Teams: schedule, contacts, report */
input[type=date], input[type=email] { min-height: var(--tap); padding: 0 12px; background: var(--panel-2); border: 2px solid transparent; border-radius: 8px; width: 100%; }
.game-row, .sub-row { display: flex; align-items: center; justify-content: space-between; gap: 8px 12px; flex-wrap: wrap; border-top: 1px solid var(--line); padding-block: 8px; }
.game-info { display: flex; flex-direction: column; min-width: 0; }
.sheet.wide { width: min(900px, 100%); }
.send-list { min-height: 60px; }
.report-preview { border: 1px solid var(--line); border-radius: 8px; max-height: 60vh; overflow: auto; -webkit-user-select: text; user-select: text; }
.ln, .hm, .ss { width: auto; }

:root[data-scheme="ocean"] { --bg: #071f2e; --panel: #0e2f44; --panel-2: #17415a; --ink: #e9f7ff; --muted: #9fc4d8; --line: #285670; --accent: #4fd1e0; --on-accent: #04202b; --cone: #ff9e6b; --on-cone: #2a0f00; --good: #7fe0b1; --good-bg: #123a2c; --warn: #f5c869; --warn-bg: #413111; --bad: #ff9aa3; --bad-bg: #4b1a22; --meter: #4fd1e0; --tick: #e9f7ff; --slash: #e5636e; --slash-hot: #ff3b49; --us-tint: rgba(79,209,224,.15); --wmp: #f39ad0; --mmp: #63d3e0; --on-tile: #071f2e; --tile: #e9f7ff; --ev-goal: #6fe0a5; --ev-assist: #8cc4ff; --ev-turn: #ff9a9a; --ev-block: #d3a6ff; --ev-opp: #f0c95a; --on-ev: #071f2e; --cross: #b58cff; --break: #ff5a68; color-scheme: dark; }
:root[data-scheme="sunrise"] { --bg: #fbeee2; --panel: #fffaf4; --panel-2: #f6dfca; --ink: #3a1f24; --muted: #7a5960; --line: #e6c8b2; --accent: #b5316b; --on-accent: #ffffff; --cone: #e0641b; --on-cone: #ffffff; --good: #0b6b45; --good-bg: #d3eee0; --warn: #7d5300; --warn-bg: #fbe8bd; --bad: #a81f2d; --bad-bg: #fbd9dc; --meter: #b5316b; --tick: #3a1f24; --slash: #c8202f; --slash-hot: #ff0a1e; --us-tint: rgba(181,49,107,.11); --wmp: #b0176b; --mmp: #1f6f8b; --on-tile: #ffffff; --tile: #3a1f24; --ev-goal: #0b7a3e; --ev-assist: #1565c0; --ev-turn: #c62828; --ev-block: #7b3fb3; --ev-opp: #8a6400; --on-ev: #ffffff; --cross: #6a2bbf; --break: #d31027; color-scheme: light; }
:root[data-scheme="sun"] { --bg: #ffffff; --panel: #ffffff; --panel-2: #e6e6e6; --ink: #000000; --muted: #2b2b2b; --line: #555555; --accent: #0018a8; --on-accent: #ffffff; --cone: #c43a00; --on-cone: #ffffff; --good: #0b6b45; --good-bg: #d3eee0; --warn: #7d5300; --warn-bg: #fbe8bd; --bad: #a81f2d; --bad-bg: #fbd9dc; --meter: #0018a8; --tick: #000000; --slash: #c8202f; --slash-hot: #ff0a1e; --us-tint: rgba(0,24,168,.14); --wmp: #b0176b; --mmp: #0a6f7d; --on-tile: #ffffff; --tile: #000000; --ev-goal: #0b7a3e; --ev-assist: #1565c0; --ev-turn: #c62828; --ev-block: #7b3fb3; --ev-opp: #8a6400; --on-ev: #ffffff; --cross: #6a2bbf; --break: #d31027; color-scheme: light; }
.scheme[data-preview="light"] .swatch { background: #e9edf5; } .scheme[data-preview="light"] .swatch i:nth-child(1) { background: #2632c9; } .scheme[data-preview="light"] .swatch i:nth-child(2) { background: #e64f00; } .scheme[data-preview="light"] .swatch i:nth-child(3) { background: #11183a; }
.scheme[data-preview="dark"] .swatch { background: #0d1126; } .scheme[data-preview="dark"] .swatch i:nth-child(1) { background: #9aa3ff; } .scheme[data-preview="dark"] .swatch i:nth-child(2) { background: #ff8a3d; } .scheme[data-preview="dark"] .swatch i:nth-child(3) { background: #eef1ff; }
.scheme[data-preview="field"] .swatch { background: #0c2418; } .scheme[data-preview="field"] .swatch i:nth-child(1) { background: #e8d44d; } .scheme[data-preview="field"] .swatch i:nth-child(2) { background: #ffb02e; } .scheme[data-preview="field"] .swatch i:nth-child(3) { background: #eefbf0; }
.scheme[data-preview="ocean"] .swatch { background: #071f2e; } .scheme[data-preview="ocean"] .swatch i:nth-child(1) { background: #4fd1e0; } .scheme[data-preview="ocean"] .swatch i:nth-child(2) { background: #ff9e6b; } .scheme[data-preview="ocean"] .swatch i:nth-child(3) { background: #e9f7ff; }
.scheme[data-preview="sunrise"] .swatch { background: #fbeee2; } .scheme[data-preview="sunrise"] .swatch i:nth-child(1) { background: #b5316b; } .scheme[data-preview="sunrise"] .swatch i:nth-child(2) { background: #e0641b; } .scheme[data-preview="sunrise"] .swatch i:nth-child(3) { background: #3a1f24; }
.scheme[data-preview="sun"] .swatch { background: #ffffff; } .scheme[data-preview="sun"] .swatch i:nth-child(1) { background: #0018a8; } .scheme[data-preview="sun"] .swatch i:nth-child(2) { background: #c43a00; } .scheme[data-preview="sun"] .swatch i:nth-child(3) { background: #000000; }

.scheme[data-preview="system"] .swatch { background: linear-gradient(135deg, #e9edf5 50%, #0d1126 50%); }
.scheme[data-preview="system"] .swatch i { background: #2632c9; }
.schemes { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.scheme { display: flex; flex-direction: column; gap: 3px; padding: 10px; border-radius: 8px; background: var(--panel-2); border: 2px solid transparent; }
.scheme[aria-pressed="true"] { border-color: var(--accent); }
.swatch { display: flex; gap: 5px; padding: 8px; border-radius: 6px; border: 1px solid var(--line); }
.swatch i { width: 18px; height: 18px; border-radius: 50%; }
/* Colored narrative */
.ev.stat { color: var(--on-ev); background: var(--ev-assist); }
.ev.stat.e-goal { background: var(--ev-goal); }
.ev.stat.e-assist { background: var(--ev-assist); }
.ev.stat.e-turn { background: var(--ev-turn); }
.ev.stat.e-block { background: var(--ev-block); }
.ev.stat.e-oppturn { background: var(--ev-opp); }
/* Live point and editor */
.timer-wrap { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.timer.paused { color: var(--muted); }
.panel-foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.btn.opp { background: var(--ev-opp); color: var(--on-ev); }
.time-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.time-row .step input { width: 84px; text-align: center; min-height: 44px; font: 700 var(--t-l)/1 var(--display); }
.time-row .step button { width: 52px; }
.pp-edit { margin-left: auto; }
/* Scoresheet marks */
.ss td { position: relative; }
.mks { position: absolute; display: flex; gap: 1px; font: 700 .6875rem/1 var(--body); pointer-events: none; }
.mks.tl { top: 2px; left: 2px; font-size: .75rem; }
.mks.br { bottom: 2px; right: 2px; font-size: .5625rem; }
.mk { padding: 0 1px; border-radius: 2px; background: var(--panel); }
.mk-a { color: var(--ev-assist); } .mk-g { color: var(--ev-goal); } .mk-t { color: var(--ev-turn); } .mk-d { color: var(--ev-block); }
/* Pass matrix by matchup */
.hm td i.mm, .hm-key i.mm { background: var(--mmp); }
.hm td i.ww, .hm-key i.ww { background: var(--wmp); }
.hm td i.xx, .hm-key i.xx { background: var(--cross); }
.hm td b.hot { color: var(--on-tile); }
.hm tr.flagged .hm-name { background: var(--warn-bg); color: var(--warn); border-radius: 4px; }
.hm-key { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.hm-key i { display: inline-block; width: 14px; height: 14px; border-radius: 3px; }
/* Style match */
.match { display: flex; flex-direction: column; gap: 6px; max-width: 520px; }
.match-row { display: grid; grid-template-columns: 96px minmax(0, 1fr) 44px; align-items: center; gap: 10px; }
.match-row b { text-align: right; }
.match-row .meter { height: 12px; margin: 0; }
.match-row.top span { font-weight: 700; }
.match-row:not(.top) .meter i { opacity: .55; }
.tabs { flex-wrap: wrap; }
@media (max-width: 520px) { .tab { padding: 0 9px; font-size: 1.125rem; } .tabs { margin-left: 0; } }
/* Energy badge and jersey in the name */
.tile.h1 { background: #f7e27a; color: #1c1400; }
.tile.h2 { background: #f5c400; color: #1c1400; }
.tile.h3 { background: #f07a00; color: #1c0a00; }
.tile.h4 { background: #d81e1e; color: #ffffff; }
.tile.sm { font-size: .8125rem; font-variant-numeric: tabular-nums; }
.no { font-weight: 400; color: var(--muted); }
.sug .no, .compact .no { font-size: .9em; }

/* Players */
.player-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 6px; }
.player-row { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 1px 10px; align-items: center; padding: 8px; border-radius: 8px; background: var(--panel-2); min-height: 62px; }
.player-row .tile { grid-row: 1 / 3; }
.player-row .small { grid-column: 2; }
.figures { display: grid; grid-template-columns: repeat(auto-fill, minmax(116px, 1fr)); gap: 6px; }
.figure { display: flex; flex-direction: column; gap: 2px; padding: 8px 10px; background: var(--panel-2); border-radius: 6px; }
.figure b { font: 700 var(--t-l)/1 var(--display); }
.linkish { color: var(--accent); text-decoration: underline; min-height: 36px; }
.partners { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(280px, 100%), 1fr)); gap: 12px; }
.sug.static b { margin-left: 4px; }
details { border-top: 1px solid var(--line); padding-block: 6px; }
summary { cursor: pointer; min-height: 40px; display: flex; align-items: center; font: 600 var(--t-l)/1 var(--display); }
.pp-row { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; padding-block: 6px; border-top: 1px solid var(--line); font-size: var(--t-s); }

/* Review, narrative drag, lineup fixes, half-width cards on phones */
.ev.stat.e-oppgoal { background: var(--ev-opp); }
[data-evi] { cursor: grab; touch-action: pan-y; padding: 3px 6px; border-radius: 4px; }
.ev[data-evi]:not(.stat) { background: var(--panel); }
.ev.dragged { opacity: .35; }
.ins-before { box-shadow: -3px 0 0 var(--cone); }
.ins-after { box-shadow: 3px 0 0 var(--cone); }
.chain-hint { flex: 1 0 100%; order: 3; }
.review { flex: 1 1 280px; min-width: 0; display: flex; align-items: center; justify-content: space-between; gap: 10px 14px; flex-wrap: wrap; background: var(--panel-2); border-radius: 8px; padding: 10px 14px; }
.review h3 { font-size: var(--t-xl); }
.review .btn.primary { min-height: 68px; font-size: var(--t-xl); }
.off-row { display: flex; align-items: center; justify-content: space-between; gap: 6px 10px; flex-wrap: wrap; }
@media (max-width: 480px) {
  .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .pc { grid-template-columns: 36px minmax(0, 1fr); padding: 6px; column-gap: 7px; }
  .pc .tile { width: 36px; height: 36px; font-size: 1.0625rem; }

<script>/* Line Caller engine: pure functions, no DOM. Everything is derived by replaying the point log. */

  const MIN = 60000;

  const TARGET_WEIGHT = { least: 0.5, less: 0.75, average: 1, more: 1.25, most: 1.5 };
  const FLOOR_PENALTY = 40; // Must outweigh any playtime debt: a minimum only breaks when nobody qualifies.
  const TAG_PENALTY = 30;
  const MAX_POSITIONS = 6;

  // Win: the best seven, tiredness barely counts, playtime ignored.
  // Balanced: rotate everyone and keep skill high. Develop: freshest players and rookies first.
  const MODES = {
    develop: { play: 1, fresh: 6, skill: 0.15, behind: 0.6, rookie: 16 },
    balanced: { play: 2.4, fresh: 1, skill: 2, behind: 1, rookie: 0 },
    win: { play: 0, fresh: 0.4, skill: 10, behind: 0, rookie: 0, best: true, quiet: true },
    // Competitive: the top seven, resting a few each point so they still have legs at the end.
    competitive: { play: 1.2, fresh: 1.5, skill: 2, behind: 0, rookie: 0, comp: true, quiet: true },
  };
  const END_ENERGY = 45; // Competitive plans for the top seven to finish at least this fresh.
  const GAP_MIN = 1.5; // Typical minutes between points.
  const MAX_RESTING = 3;

  // Only minimums: any spots left over go to whoever fits best.
  const defaultPositions = () => [
    { id: 'H', name: 'Handler', abbr: 'H', skill: 'h', floor: 3, O: { min: 3 }, D: { min: 2 } },
    { id: 'C', name: 'Cutter', abbr: 'C', skill: 'c', floor: 2, O: { min: 0 }, D: { min: 0 } },
    { id: 'D', name: 'Defender', abbr: 'D', skill: 'd', floor: 2, O: { min: 0 }, D: { min: 0 } },
  ];

  const defaultRules = () => ({
    size: 7,
    division: 'open',
    ratioMode: 'abba',
    ratioStart: 'W',
    halfAt: 8,
    gameTo: 15,
    positions: defaultPositions(),
    tolerance: 2,
    maxStreak: 2,
    tags: ['Deep', 'Lockdown', 'Puller', 'Leader', 'Rookie'],
    tagRules: [
      { tag: 'Puller', min: 1, max: null, when: 'D' },
      { tag: 'Leader', min: 1, max: null, when: 'all' },

  function shares(players, size) {

      capped.forEach((p) => out.set(p.id, 1));
      left -= capped.length;
      pool = pool.filter((p) => !capped.includes(p));

  function onFieldMs(point, id) {
    const start = point.startedAt;
    const end = point.endedAt;
    let ms = point.lineup.includes(id) ? end - start : 0;

      if (s.out === id) ms -= end - s.at;
      if (s.in === id) ms += end - s.at;

    return Math.max(0, ms);

  const emptyStats = (id) => ({ id, played: 0, O: 0, D: 0, ms: 0, target: 0, energy: 100, streak: 0, touch: 0, goal: 0, assist: 0, turn: 0, block: 0 });

  // Replays the log into per-player totals: points, minutes, target, energy, streak, touches.
  function replay(game, players, rules, extraPoints) {
    const stats = new Map();

    const byId = new Map(players.map((p) => [p.id, p]));
    const points = extraPoints ? game.points.concat(extraPoints) : game.points;
    let prevEnd = null;
    for (const pt of points) {

      for (const p of players) {

        const stamina = rate(p, 's');

    return stats;
  }

  function score(game) {
    let us = 0, them = 0;
    for (const p of game.points) p.result === 'us' ? us++ : them++;
    return { us, them };
  }

  // What the next point is: O or D, which group gets the extra player, and how soon the game could end.
  function context(game, rules) {
    const points = game.points;
    const n = points.length;
    let on = game.startOn;
    let halftime = false;
    let us = 0, them = 0;
    points.forEach((p, i) => {
      const before = Math.max(us, them);
      p.result === 'us' ? us++ : them++;
      if (i === n - 1 && before < rules.halfAt && Math.max(us, them) >= rules.halfAt) halftime = true;
    });

      if (halftime) on = game.startOn === 'O' ? 'D' : 'O';
    }
    let ratio = null;
    if (rules.division === 'mixed') {
      const a = rules.ratioStart;
      const b = a === 'W' ? 'M' : 'W';

  function limitsFor(rules, on, n, fixedCounts) {

          }

        for (let i = 0; i < k - 1 && ok; i++) if (Math.floor(s / mult[i]) % radix[i] < limits[i].min) ok = false;
        if (ok && line.length - sum[s] < limits[k - 1].min) ok = false;
        if (!ok) continue;

  // Rough points left in the game, from the score so far and how the game has been going.
  function pointsLeft(game, rules, ctx) {
    const { us, them } = score(game);
    if (ctx.minLeft <= 1) return us === them ? 1 : 2; // Universe point is the last; game point may not be.
    const rate = (us + 4) / (us + them + 8); // Starts near even, so one early point barely moves it.
    return Math.max(1, Math.ceil(0.9 * Math.min((rules.gameTo - us) / rate, (rules.gameTo - them) / (1 - rate))));

    const size = Math.min(rules.size, avail.length);
    const fixedCounts = {};
    Object.values(fixed || {}).forEach((pos) => { fixedCounts[pos] = (fixedCounts[pos] || 0) + 1; });
    const limits = limitsFor(rules, ctx.on, size, fixedCounts);
    const sh = shares(avail, rules.size);
    const value = new Map(), rows = new Map();
    const plan = m.comp ? rotationPlan(game, players, rules, ctx, stats) : null;
    for (const p of avail) {
      const s = stats.get(p.id);
      const gap = s.target + (sh.get(p.id) || 0) * 0.5 - s.played;
      let v = 2 * m.play * clamp(gap, -4, 6);
      const owed = s.target - s.played;
      if (owed > rules.tolerance) v += (owed - rules.tolerance) * 6 * m.behind;
      if (owed < -rules.tolerance) v += (owed + rules.tolerance) * 3 * m.behind;
      v -= m.fresh * 6 * Math.pow(1 - s.energy / 100, 2);
      if (!m.best) {
        if (s.energy < 40) v -= 4;
        if (s.streak >= rules.maxStreak) v -= (s.streak - rules.maxStreak + 1) * 6;
        const need = minPointsOf(p) - s.played;
        if (need > 0) { v += 8 * Math.min(1, need / ctx.minLeft); if (need >= ctx.minLeft) v += 30; }
      }
      if (m.rookie && p.tags.some((t) => /rookie/i.test(t))) v += m.rookie;
      if (plan && plan.stay.has(p.id)) v = 25; else if (plan && plan.sitIds.has(p.id)) v = -25;
      value.set(p.id, v);
      rows.set(p.id, limits.map((l) => {
        const r = rate(p, l.skill);
        // Defense counts for more when we start the point on defense.
        const weight = l.skill === 'd' && !ctx.neutral ? (ctx.on === 'D' ? 1.2 : 0.7) : 1;
        return m.skill * weight * (r - 3) + 0.02 * r - (r < l.floor ? (l.floor - r) * FLOOR_PENALTY : 0);
      }));
    }
    const fixedIdx = new Map();
    Object.entries(fixed || {}).forEach(([id, pos]) => { const i = limits.findIndex((l) => l.id === pos); if (i >= 0) fixedIdx.set(id, i); });
    const tagRules = rules.tagRules.filter((t) => t.when === 'all' || t.when === ctx.on);
    return { m, plan, avail, size, limits, assign: makeAssigner(limits, size), value, rows, tagRules, rules, ctx, stats, fixedIdx, fixed: fixed || {} };
  }

  function lineScore(model, line) {
    let sum = model.assign(line, model.rows, model.fixedIdx, false);
    for (const p of line) sum += model.value.get(p.id);
    for (const t of model.tagRules) {
      const count = line.filter((p) => p.tags.includes(t.tag)).length;
      if (t.min && count < t.min) sum -= (t.min - count) * TAG_PENALTY;
      if (t.max !== null && t.max !== undefined && count > t.max) sum -= (count - t.max) * TAG_PENALTY;
    }
    return sum;
  }

  function groupNeeds(model, locksIn) {
    const { avail, size, ctx, rules } = model;
    if (!ctx.ratio) return { useGroups: false };
    const countW = avail.filter((p) => p.match === 'W').length;
    const countM = avail.length - countW;
    const major = Math.ceil(rules.size / 2), minor = Math.floor(rules.size / 2);
    let needW = ctx.ratio === 'W' ? major : minor;
    const lockedW = locksIn.filter((p) => p.match === 'W').length;
    const lockedM = locksIn.length - lockedW;
    needW = Math.max(needW, lockedW);
    needW = Math.min(needW, size - lockedM);
    needW = Math.min(needW, countW);
    if (size - needW > countM) needW = size - countM;
    return { useGroups: true, needW, needM: size - needW };
  }

  function search(model, count, seed) {
    const { avail, size, fixed } = model;
    const locksIn = avail.filter((p) => fixed[p.id]).slice(0, size);
    const pool = avail.filter((p) => !fixed[p.id]);
    const needs = groupNeeds(model, locksIn);
    const found = new Map();
    const random = rng(seed);
    const shuffled = (arr) => {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
      return a;
    };
    const lockedSet = new Set(locksIn.map((p) => p.id));
    const restarts = model.ctx.fast ? 6 : model.limits.length > 4 ? 12 : 24;
    for (let restart = 0; restart < restarts; restart++) {
      const line = locksIn.slice();
      const rest = shuffled(pool);
      const take = (pred, n) => {
        for (let i = 0; i < rest.length && n > 0;) {
          if (pred(rest[i])) { line.push(rest[i]); rest.splice(i, 1); n--; } else i++;
        }
      };
      if (needs.useGroups) {
        const haveW = locksIn.filter((p) => p.match === 'W').length;
        take((p) => p.match === 'W', needs.needW - haveW);
        take((p) => p.match !== 'W', needs.needM - (locksIn.length - haveW));
      }
      take(() => true, size - line.length);
      let cur = lineScore(model, line);
      for (let step = 0; step < 30; step++) {
        let bestDelta = 1e-9, bi = -1, bj = -1;
        for (let i = 0; i < line.length; i++) {
          if (lockedSet.has(line[i].id)) continue;
          for (let j = 0; j < rest.length; j++) {
            if (needs.useGroups && (rest[j].match === 'W') !== (line[i].match === 'W')) continue;
            const old = line[i];
            line[i] = rest[j];
            const delta = lineScore(model, line) - cur;
            line[i] = old;
            if (delta > bestDelta) { bestDelta = delta; bi = i; bj = j; }
          }
        }
        if (bi < 0) break;
        const t = line[bi]; line[bi] = rest[bj]; rest[bj] = t;
        cur += bestDelta;
        found.set(line.map((p) => p.id).sort().join('|'), { line: line.slice(), score: cur });
      }
      found.set(line.map((p) => p.id).sort().join('|'), { line: line.slice(), score: lineScore(model, line) });
    }
    return [...found.values()].sort((a, b) => b.score - a.score).slice(0, count);
  }

  const skillLabel = (rules, key) => {
    const base = { h: 'Handling', c: 'Cutting', d: 'Defense', s: 'Stamina' };
    if (base[key]) return base[key];
    const p = rules.positions.find((x) => x.skill === key);
    return p ? p.name : key;
  };

  function describe(model, line, score, partial) {
    const { rules, ctx, stats, avail, limits } = model;
    const useAssign = line.length === model.size ? model.assign : makeAssigner(limits, line.length);
    const useLimits = line.length === model.size ? limits : limitsFor(rules, ctx.on, line.length, Object.fromEntries(limits.map((l) => [l.id, l.f])));
    const assign = useLimits === limits ? useAssign : makeAssigner(useLimits, line.length);
    const fixedIdx = new Map();
    model.fixedIdx.forEach((i, id) => { const pos = limits[i].id; fixedIdx.set(id, useLimits.findIndex((l) => l.id === pos)); });
    const { roles } = assign(line, model.rows, fixedIdx, true);
    const warnings = [];
    for (const l of limits) {
      const inRole = line.filter((p) => roles[p.id] === l.id);
      const weak = inRole.filter((p) => rate(p, l.skill) < l.floor);
      if (weak.length) warnings.push(`${weak.map((p) => p.name).join(', ')} ${weak.length > 1 ? 'are' : 'is'} under your ${l.name.toLowerCase()} minimum of ${l.floor}.`);
      if (!partial) {
        const pos = rules.positions.find((p) => p.id === l.id)[ctx.on];
        if (inRole.length < pos.min && line.length === rules.size) warnings.push(`${inRole.length} at ${l.name.toLowerCase()}. You asked for at least ${pos.min}.`);
      }
    }
    if (!partial) {
      for (const t of model.tagRules) {
        const count = line.filter((p) => p.tags.includes(t.tag)).length;
        if (t.min && count < t.min && avail.some((p) => p.tags.includes(t.tag))) warnings.push(`No ${t.tag.toLowerCase()} on this line. Your rule asks for ${t.min}.`);
        if (t.max !== null && t.max !== undefined && count > t.max) warnings.push(`${count} ${t.tag.toLowerCase()}s on this line. Your rule allows ${t.max}.`);
      }
      if (ctx.ratio) {
        const w = line.filter((p) => p.match === 'W').length;
        const major = Math.ceil(rules.size / 2), minor = Math.floor(rules.size / 2);
        const wantW = ctx.ratio === 'W' ? major : minor;
        if (w !== wantW) warnings.push(`Ratio is off: ${w} women-matching and ${line.length - w} men-matching. This point calls for ${wantW} and ${rules.size - wantW}.`);
      }
      if (line.length < rules.size) warnings.push(`Only ${line.length} players available for ${rules.size} spots.`);
    }
    const onIds = new Set(line.map((p) => p.id));
    if (!model.m.quiet) for (const p of line) {
      const s = stats.get(p.id);
      if (s.streak >= rules.maxStreak) warnings.push(`${p.name} would play ${s.streak + 1} points in a row.`);
    }
    if (!partial) {
      for (const p of avail) {
        const s = stats.get(p.id);
        if (onIds.has(p.id)) continue;
        if (!model.m.quiet && s.target - s.played > rules.tolerance) warnings.push(`${p.name} is sitting and ${(s.target - s.played).toFixed(1)} points behind target.`);
        const need = minPointsOf(p) - s.played;
        if (need > 0 && need >= ctx.minLeft) warnings.push(`${p.name} still needs ${need} of a ${minPointsOf(p)}-point minimum, and the game could end in ${ctx.minLeft}.`);
      }
    }
    const mean = (arr, k) => arr.reduce((a, p) => a + rate(p, k), 0) / Math.max(1, arr.length);
    const strength = [];
    const seen = new Set();
    for (const l of limits) {
      if (seen.has(l.skill)) continue;
      seen.add(l.skill);
      strength.push({ key: l.skill, label: skillLabel(rules, l.skill), line: mean(line, l.skill), team: mean(avail, l.skill) });
    }
    const plan = model.plan ? { left: model.plan.left, rest: model.plan.sit.filter((p) => !onIds.has(p.id)).map((p) => p.name) } : null;
    return { ids: line.map((p) => p.id), roles, score, warnings, strength, plan };
  }

  function suggest(game, players, rules, opts) {
    const ctx = opts.ctx || context(game, rules);
    const stats = opts.stats || replay(game, players, rules);
    const model = buildModel(game, players, rules, ctx, stats, opts.fixed);
    if (!model.avail.length) return [];
    const res = search(model, opts.count || 6, 1000 + ctx.pointNo * 7);
    return res.map((r) => describe(model, r.line, r.score));
  }

  // Rates a line the coach built by hand. Pass fixed to keep the positions the coach chose.
  function evaluate(game, players, rules, ids, opts) {
    const ctx = opts.ctx || context(game, rules);
    const stats = opts.stats || replay(game, players, rules);
    const model = buildModel(game, players, rules, ctx, stats, opts.fixed);
    const byId = new Map(players.map((p) => [p.id, p]));
    const line = ids.map((id) => byId.get(id)).filter(Boolean);
    if (line.some((p) => !model.value.has(p.id))) return null;
    if (line.length === model.size) return describe(model, line, lineScore(model, line), opts.partial);
    return describe(model, line, 0, opts.partial);
  }

  // The line we would call next if the live point ended now with this result.
  function preview(game, players, rules, result, durMs) {
    const live = game.live;
    const finished = { ...live, endedAt: live.startedAt + durMs, result, subs: live.subs || [] };
    const sim = { ...game, points: game.points.concat([finished]), live: null };
    const best = suggest(sim, players, rules, { count: 1 })[0];
    return { ctx: context(sim, rules), line: best || null };
  }

  // For every point played, compares the line you called with what each priority would have called.
  function profileMatch(games, players, rules) {
    const modes = ['develop', 'balanced', 'competitive', 'win'];
    const sum = Object.fromEntries(modes.map((m) => [m, 0]));
    let n = 0;
    for (const g of games) {
      g.points.forEach((pt, i) => {
        const avail = new Set(pt.avail || players.map((p) => p.id));
        const out = Object.fromEntries(players.filter((p) => !avail.has(p.id)).map((p) => [p.id, true]));
        const called = pt.lineup.filter((id) => players.some((p) => p.id === id));
        if (!called.length) return;
        const base = { startOn: g.startOn || 'O', points: g.points.slice(0, i), out };
        const stats = replay(base, players, rules);
        const ctx = { ...context(base, rules), on: pt.on, ratio: pt.ratio === undefined ? null : pt.ratio, fast: true };
        for (const mode of modes) {
          const best = suggest({ ...base, mode }, players, rules, { ctx, stats, count: 1 })[0];
          if (best) sum[mode] += best.ids.filter((id) => called.includes(id)).length / called.length;
        }
        n++;
      });
    }
    return { n, list: modes.map((mode) => ({ mode, avg: n ? sum[mode] / n : 0 })).sort((a, b) => b.avg - a.avg) };
  }

  const fresh = (energy) => (energy >= 70 ? 'Fresh' : energy >= 40 ? 'OK' : 'Tired');

  /* ---------- Touch log ---------- */
  const BREAKS = new Set(['turn', 'block', 'goal', 'oppturn', 'oppgoal']);
  const NEEDS_DISC = new Set(['touch', 'assist', 'goal']);
  function chainOf(events) {
    const out = [];
    for (let i = events.length - 1; i >= 0; i--) {
      if (BREAKS.has(events[i].t)) break;
      out.unshift(events[i]);
    }
    return out;
  }
  // Adds one stat. A goal credits the scorer with a touch and the previous thrower with the assist.
  function addEvent(events, ev, at) {
    const before = events[events.length - 1];
    // We turned it over and now we have it again, so the other team must have given it back.
    if (before && before.t === 'turn' && NEEDS_DISC.has(ev.t)) events.push({ t: 'oppturn', at, implicit: true });
    const chain = chainOf(events);
    const touches = chain.filter((e) => e.t === 'touch');
    const lastTouch = touches[touches.length - 1];
    if (ev.t === 'touch') {
      if (lastTouch && lastTouch.id === ev.id) return;
      events.push({ t: 'touch', id: ev.id, at });
      return;
    }
    if (ev.t === 'assist') {
      if (!lastTouch || lastTouch.id !== ev.id) events.push({ t: 'touch', id: ev.id, at });
      events.push({ t: 'assist', id: ev.id, at });
      return;
    }
    if (ev.t === 'goal') {
      const hasAssist = chain.some((e) => e.t === 'assist');
      const prior = touches.filter((e) => e.id !== ev.id).pop();
      if (!lastTouch || lastTouch.id !== ev.id) events.push({ t: 'touch', id: ev.id, at });
      if (!hasAssist && prior) {
        const thrower = lastTouch && lastTouch.id !== ev.id ? lastTouch.id : prior.id;
        events.push({ t: 'assist', id: thrower, at, auto: true });
      }
      events.push({ t: 'goal', id: ev.id, at });
      return;
    }
    events.push({ t: ev.t, id: ev.id, at });
  }

  // Rebuilds what the app filled in by itself after the coach reorders a point.
  function reflow(events) {
    const out = [];
    for (const ev of events) {
      if (ev.implicit || ev.auto) continue;
      const last = out[out.length - 1];
      if (last && last.t === 'turn' && NEEDS_DISC.has(ev.t)) out.push({ t: 'oppturn', at: ev.at, implicit: true });
      if (ev.t === 'goal') {
        const chain = chainOf(out);
        if (!chain.some((x) => x.t === 'assist')) {
          const prior = chain.filter((x) => x.t === 'touch' && x.id !== ev.id).pop();
          if (prior) out.push({ t: 'assist', id: prior.id, at: ev.at, auto: true });
        }
      }
      out.push(ev);
    }
    return out;
  }

  /* ---------- Understanding speech ---------- */
  function lev(a, b) {
    if (a === b) return 0;
    let prev = Array.from({ length: b.length + 1 }, (_, i) => i);
    for (let i = 1; i <= a.length; i++) {
      const cur = [i];
      for (let j = 1; j <= b.length; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
      prev = cur;
    }
    return prev[b.length];
  }
  const ratio = (a, b) => 1 - lev(a, b) / Math.max(a.length, b.length, 1);
  const soundKey = (s) => s.replace(/ph/g, 'f').replace(/ck/g, 'k').replace(/c(?=[eiy])/g, 's').replace(/c/g, 'k').replace(/q/g, 'k').replace(/x/g, 'ks').replace(/z/g, 's').replace(/dg/g, 'j').replace(/gh/g, '').replace(/wr/g, 'r').replace(/kn/g, 'n').replace(/h(?![aeiouy])/g, '').replace(/[aeiouy]+/g, 'a').replace(/(.)\1+/g, '$1');
  const similar = (a, b) => (a === b ? 1 : Math.max(ratio(a, b), ratio(soundKey(a), soundKey(b)) * 0.92));
  const clean = (s) => s.toLowerCase().replace(/['’]s\b/g, '').replace(/[^a-z0-9\s]/g, ' ').replace(/\s+/g, ' ').trim();

  const STOP = new Set('to too two throws throw threw throwing pass passes passed passing hits hit finds found swing swings swung dump dumps dumped huck hucks hucked catches catch caught then and over it the a an by up back from for with his her their he she they we our in on at is was were great nice ok okay number gets got has had um uh so now next of out one this that there get goes put puts line at as be are will who which just really good big huge awesome beautiful grab grabs snag snags reset resets dish dishes flick flicks backhand forehand hammer hammers around through into long short left right side end zone endzone field down disc frisbee me you i oh yeah like after getting off onto across again still another first'.split(' '));
  const TO_WORDS = new Set('to too two hits hit finds found over'.split(' '));
  const KW = new Map();
  for (const w of 'goal goals score scores scored scoring touchdown'.split(' ')) KW.set(w, 'goal');
  for (const w of 'throwaway throwaways turf turfed overthrow overthrew overthrown incomplete'.split(' ')) KW.set(w, 'throwaway');
  for (const w of 'turnover turnovers turn stall stalled fumble fumbled'.split(' ')) KW.set(w, 'turn');
  KW.set('oppturn', 'oppturn');
  for (const w of 'drop drops dropped bobbled missed'.split(' ')) KW.set(w, 'drop');
  for (const w of 'block blocks blocked d takeaway interception intercepted intercepts swat swats swatted'.split(' ')) KW.set(w, 'block');
  for (const w of 'assist assists assisted'.split(' ')) KW.set(w, 'assist');

  // Common short forms. A shared start ("Jim" and "Jimmy") is handled separately.
  const NICKNAMES = ['jim jimmy james jamie', 'mike mikey mick mickey michael', 'bob bobby rob robby robbie robert', 'bill billy will willy william liam', 'rick ricky rich richie richard', 'jack johnny jon john', 'liz lizzie beth betsy eliza elizabeth', 'kate katie kat katherine catherine kathryn', 'tony anthony', 'ted teddy theo theodore', 'chuck charlie charles', 'matt matty matthew', 'dan danny daniel', 'dave davey david', 'tom tommy thomas', 'joe joey joseph', 'nick nicky nicholas nico', 'alex alexander alexandra lex', 'sam sammy samuel samantha', 'ben benny benjamin', 'ella ellie eleanor', 'maddie maddy madison madeline', 'abby abigail', 'zach zack zac zachary zak'].map((s) => s.split(' '));
  function nicknameScore(token, name) {
    if (token === name) return 1;
    if (NICKNAMES.some((g) => g.includes(token) && g.includes(name))) return 0.9;
    if (token.length >= 3 && name.length >= 3 && (name.startsWith(token) || token.startsWith(name))) return 0.86;
    return 0;
  }
  function variantsOf(p) {
    const list = [];
    const full = clean(p.name);
    const words = full.split(' ');
    list.push(full);
    if (words.length > 1) list.push(words[0]);
    if (p.aliases) p.aliases.split(',').map(clean).filter(Boolean).forEach((a) => list.push(a));
    return list.filter(Boolean);
  }
  function mentionAt(tokens, i, players, blocked) {
    let best = null, second = 0;
    for (let w = 2; w >= 1; w--) {
      if (i + w > tokens.length) continue;
      const slice = tokens.slice(i, i + w);
      const phrase = slice.join(' ');
      const joined = slice.join('');
      const anyBlocked = slice.some((t) => blocked.has(t));
      for (const p of players) {
        let top = 0;
        for (const v of variantsOf(p)) {
          const vw = v.split(' ').length;
          if (phrase === v) { top = 1; break; }
          if (anyBlocked || joined.length < 3) continue;
          if (vw === 1 && w === 1) top = Math.max(top, nicknameScore(phrase, v));
          if (vw === w) top = Math.max(top, similar(phrase, v));
          else if (w === 2 && vw === 1) top = Math.max(top, similar(joined, v));
        }
        if (top < 0.72) continue;
        if (!best || top > best.score + 1e-9 || (w > best.w && top >= best.score - 1e-9)) { if (best && best.p.id !== p.id) second = Math.max(second, best.score); best = { p, score: top, w }; } else if (best.p.id !== p.id) second = Math.max(second, top);
      }
      if (best && best.score === 1) break;
    }
    if (!best) return null;
    return { id: best.p.id, w: best.w, score: best.score, unsure: best.score < 0.8 || second >= best.score - 0.03 };
  }

  // "number twelve", "number twenty one" or "number 21".
  const ONES = 'zero one two three four five six seven eight nine ten eleven twelve thirteen fourteen fifteen sixteen seventeen eighteen nineteen'.split(' ');
  const TENS = ['', '', 'twenty', 'thirty', 'forty', 'fifty', 'sixty', 'seventy', 'eighty', 'ninety'];
  function jerseyAt(tokens, i, players) {
    const a = tokens[i], b = tokens[i + 1];
    if (a === undefined) return null;
    const find = (n) => players.find((x) => x.no !== '' && String(x.no) === String(n));
    if (/^\d+$/.test(a)) { const p = find(a); return p ? { p, w: 1 } : null; }
    const tens = TENS.indexOf(a);
    if (tens >= 2) {
      const unit = ONES.indexOf(b);
      if (unit >= 1 && unit <= 9) { const p = find(tens * 10 + unit); if (p) return { p, w: 2 }; }
      const p = find(tens * 10); return p ? { p, w: 1 } : null;
    }
    const one = ONES.indexOf(a);
    if (one >= 0) { const p = find(one); return p ? { p, w: 1 } : null; }
    return null;
  }

  // The words the recognizer listens for in roster mode: this team's names plus how coaches call plays.
  function speechVocabulary(players, positions) {
    const words = new Set(['[unk]', 'they', 'scored', 'score', 'threw', 'throw', 'throws', 'away', 'out', 'of', 'bounds', 'turned', 'turns', 'it', 'over', 'other', 'team', 'opponent', 'opponents', 'their', 'for', 'the', 'point', 'knocked', 'use', 'suggestion', 'suggested', 'clear', 'start', 'take', 'swap', 'switch', 'replace', 'sub', 'substitute', 'remove', 'bench', 'sit', 'in', 'number']);
    for (const w of KW.keys()) if (w !== 'oppturn') words.add(w);
    for (const w of STOP) words.add(w);
    ONES.concat(TENS).filter(Boolean).forEach((w) => words.add(w));
    for (const pos of positions) { const n = clean(pos.name); n.split(' ').forEach((w) => { words.add(w); words.add(w + 's'); }); }
    for (const p of players) {
      for (const v of variantsOf(p)) {
        v.split(' ').filter((w) => w.length > 1).forEach((w) => {
          words.add(w);
          NICKNAMES.filter((g) => g.includes(w)).forEach((g) => g.forEach((x) => words.add(x)));
        });
      }
    }
    return [...words];
  }

  function preparePlay(text) {
    return ` ${clean(text)} `
      .replace(/ (they|opponents?|other team|their( \w+)?)( \w+)? (turned it over|turn it over|turnover|dropped it|dropped|drop it|threw it away|throw it away|turfed it|turfed)( it)? /g, ' oppturn ')
      .replace(/ (opponent|other team) turnover /g, ' oppturn ')
      .replace(/ (turned|turns|turn) it over /g, ' turn ')
      .replace(/ for the point /g, ' goal ')
      .replace(/ knocked (it )?down /g, ' block ')
      .replace(/ (throw|threw|throws|thrown)( it)? away /g, ' throwaway ')
      .replace(/ (throw|threw|throws)( it)? out /g, ' throwaway ')
      .replace(/ out of bounds /g, ' throwaway ')
      .replace(/ they (scored|score|scores) /g, ' theyscored ')
      .replace(/ (they|other team) (got|get) (the )?(goal|point) /g, ' theyscored ')
      .replace(/ we (scored|score) /g, ' goal ')
      .trim().split(' ').filter(Boolean);
  }

  // "Ari throws to Lucie, Lucie to Kyle, Kyle to Mavis, goal" becomes a list of touches and stats.
  function parsePlay(text, players, opts) {
    const tokens = preparePlay(text);
    const seq = [], unknown = [];
    const blocked = new Set([...STOP, ...KW.keys(), 'theyscored']);
    let viaTo = false, viaBy = false, viaFrom = false;
    for (let i = 0; i < tokens.length;) {
      const t = tokens[i];
      if (t === 'number') {
        const j = jerseyAt(tokens, i + 1, players.concat((opts && opts.bench) || []));
        if (j) { seq.push({ k: 'p', id: j.p.id, via: viaTo, by: viaBy, unsure: false }); viaTo = viaBy = false; i += 1 + j.w; continue; }
      }
      // Prefer someone on the field. Only a clearly better match pulls a bench player in.
      let m = mentionAt(tokens, i, players, blocked);
      if (opts && opts.bench) {
        const off = mentionAt(tokens, i, opts.bench, blocked);
        if (off && (!m || off.score > m.score + 0.05)) m = off;
      }
      if (m && !(KW.has(t) && m.w === 1 && !players.some((p) => variantsOf(p).includes(t)))) {
        seq.push({ k: 'p', id: m.id, via: viaTo, by: viaBy, from: viaFrom, unsure: m.unsure });
        viaTo = viaBy = viaFrom = false; i += m.w; continue;
      }
      if (t === 'theyscored') seq.push({ k: 'they' });
      else if (KW.has(t)) seq.push({ k: KW.get(t) });
      else if (TO_WORDS.has(t)) viaTo = true;
      else if (t === 'by') viaBy = true;
      else if (t === 'from') viaFrom = true;
      else if (!STOP.has(t) && t.length >= 3) unknown.push(t);
      i++;
    }
    const events = opts && opts.holder ? [{ t: 'touch', id: opts.holder, seed: true }] : [];
    let theyScored = false, nameless = false;
    const lastTouchIdx = () => { for (let i = events.length - 1; i >= 0; i--) if (events[i].t === 'touch') return i; return -1; };
    const touch = (it) => { const l = events[events.length - 1]; if (l && l.t === 'touch' && l.id === it.id) return; events.push({ t: 'touch', id: it.id, unsure: it.unsure, via: it.via }); };
    for (let i = 0; i < seq.length; i++) {
      const it = seq[i], nx = seq[i + 1];
      if (it.k === 'p') {
        if (nx && nx.k === 'block' && !(seq[i + 2] && seq[i + 2].k === 'p' && seq[i + 2].by)) { events.push({ t: 'block', id: it.id, unsure: it.unsure }); i++; continue; }
        if (nx && nx.k === 'assist') { events.push({ t: 'assist', id: it.id, unsure: it.unsure }); i++; continue; }
        touch(it);
      } else if (it.k === 'goal') {
        let credited = null;
        while (seq[i + 1] && seq[i + 1].k === 'p') {
          const next = seq[i + 1], then = seq[i + 2];
          const assistBelongsHere = then && then.k === 'assist' && !(seq[i + 3] && seq[i + 3].k === 'p');
          if (next.from || assistBelongsHere) { credited = next; i += assistBelongsHere ? 2 : 1; continue; }
          i++; touch(next);
        }
        if (!credited && seq[i + 1] && seq[i + 1].k === 'assist' && seq[i + 2] && seq[i + 2].k === 'p') { credited = seq[i + 2]; i += 2; }
        const li = lastTouchIdx();
        if (li >= 0) {
          const scorer = events[li];
          if (credited) events.splice(li, 0, { t: 'assist', id: credited.id, unsure: credited.unsure });
          events.push({ t: 'goal', id: scorer.id, unsure: scorer.unsure });
        } else nameless = true;
      } else if (it.k === 'throwaway' || it.k === 'turn' || it.k === 'drop') {
        if (nx && nx.k === 'p' && nx.by) { events.push({ t: 'turn', id: nx.id, unsure: nx.unsure }); i++; continue; }
        const li = lastTouchIdx();
        if (li < 0) continue;
        const holder = events[li];
        if (it.k === 'drop') { events.splice(li, 1); events.push({ t: 'turn', id: holder.id, unsure: holder.unsure, drop: true }); } else if (it.k === 'throwaway' && holder.via && li > 0 && events[li - 1].t === 'touch') { events.splice(li, 1); events.push({ t: 'turn', id: events[li - 1].id, unsure: events[li - 1].unsure }); } else events.push({ t: 'turn', id: holder.id, unsure: holder.unsure });
      } else if (it.k === 'block') {
        if (nx && nx.k === 'p') { events.push({ t: 'block', id: nx.id, unsure: nx.unsure }); i++; }
      } else if (it.k === 'assist') {
        if (nx && nx.k === 'p') { events.push({ t: 'assist', id: nx.id, unsure: nx.unsure }); i++; }
      } else if (it.k === 'oppturn') events.push({ t: 'oppturn' });
      else if (it.k === 'they') theyScored = true;
    }
    return { events, unknown, theyScored, nameless, hasGoal: events.some((e) => e.t === 'goal') || nameless };
  }

  function prepareLine(text) {
    return ` ${clean(text)} `
      .replace(/ use (the )?(suggestion|suggested( line)?) /g, ' usesuggestion ')
      .replace(/ (clear( the)?( line)?|start over) /g, ' clearline ')
      .replace(/ take out /g, ' remove ')
      .trim().split(' ').filter(Boolean);
  }

  // "Handlers Ari, Bea, Cal. Cutters Dee, Fen." or "Swap Bea for Cal" or just seven names.
  function parseLine(text, players, positions, opts) {
    const tokens = prepareLine(text);
    const posWords = new Map();
    positions.forEach((p) => { const n = clean(p.name); posWords.set(n, p.id); posWords.set(n + 's', p.id); });
    const CMD = new Map([['swap', 'swap'], ['switch', 'swap'], ['replace', 'swap'], ['sub', 'sub'], ['substitute', 'sub'], ['remove', 'remove'], ['bench', 'remove'], ['sit', 'remove'], ['out', 'out'], ['in', 'in']]);
    const blocked = new Set([...STOP, ...CMD.keys(), ...posWords.keys(), 'usesuggestion', 'clearline']);
    const seq = [], unknown = [];
    const out = { assign: [], remove: [], swaps: [], clear: false, useSuggestion: false, unknown };
    for (let i = 0; i < tokens.length;) {
      const t = tokens[i];
      if (t === 'usesuggestion') { out.useSuggestion = true; i++; continue; }
      if (t === 'clearline') { out.clear = true; i++; continue; }
      if (t === 'number') {
        const j = jerseyAt(tokens, i + 1, players);
        if (j) { seq.push({ k: 'p', id: j.p.id, unsure: false }); i += 1 + j.w; continue; }
      }
      const m = mentionAt(tokens, i, players, blocked);
      if (m) { seq.push({ k: 'p', id: m.id, unsure: m.unsure }); i += m.w; continue; }
      if (CMD.has(t)) { seq.push({ k: CMD.get(t) }); i++; continue; }
      let pos = posWords.get(t);
      if (!pos && t.length >= 4) for (const [w, id] of posWords) if (similar(t, w) >= 0.82) { pos = id; break; }
      if (pos) { seq.push({ k: 'pos', id: pos }); out.lastPos = pos; i++; continue; }
      if (!STOP.has(t) && t.length >= 3) unknown.push(t);
      i++;
    }
    const rest = [];
    for (let i = 0; i < seq.length; i++) {
      const it = seq[i], a = seq[i + 1], b = seq[i + 2];
      if (it.k === 'swap' && a && a.k === 'p' && b && b.k === 'p') { out.swaps.push({ out: a.id, in: b.id }); i += 2; continue; }
      if (it.k === 'sub' && a && a.k === 'p' && b && b.k === 'in' && seq[i + 3] && seq[i + 3].k === 'p') { out.swaps.push({ out: seq[i + 3].id, in: a.id }); i += 3; continue; }
      if (it.k === 'sub' && a && a.k === 'p' && b && b.k === 'p') { out.swaps.push({ out: b.id, in: a.id }); i += 2; continue; }
      if (it.k === 'remove') { while (seq[i + 1] && seq[i + 1].k === 'p') { i++; out.remove.push(seq[i].id); } continue; }
      if (it.k === 'p' && a && a.k === 'in' && b && b.k === 'p') { out.swaps.push({ out: b.id, in: it.id }); i += 2; continue; }
      if (it.k === 'p' && a && a.k === 'out') { out.remove.push(it.id); i++; continue; }
      if (it.k === 'p' || it.k === 'pos') rest.push(it);
    }
    const firstP = rest.findIndex((x) => x.k === 'p'), firstPos = rest.findIndex((x) => x.k === 'pos');
    const headingFirst = firstPos >= 0 && (firstP < 0 || firstPos < firstP);
    const push = (it, pos) => { if (!out.assign.some((a) => a.id === it.id)) out.assign.push({ id: it.id, pos, unsure: it.unsure }); };
    if (firstPos < 0) rest.forEach((it) => push(it, (opts && opts.pos) || null));
    else if (headingFirst) { let cur = null; rest.forEach((it) => { if (it.k === 'pos') cur = it.id; else push(it, cur); }); } else {
      let pending = [];
      rest.forEach((it) => { if (it.k === 'p') pending.push(it); else { pending.forEach((x) => push(x, it.id)); pending = []; } });
      pending.forEach((x) => push(x, null));
    }
    return out;
  }

  return { MIN, MAX_POSITIONS, TARGETS, defaultRules, defaultPositions, rate, replay, score, context, suggest, evaluate, preview, fresh, shares, limitsFor, skillLabel, addEvent, reflow, chainOf, profileMatch, speechVocabulary, parsePlay, parseLine, minPointsOf };
})();
